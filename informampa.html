// ─── Motor clínico ───────────────────────────────────────────────────
function smean(m) {
  const s=nn(m.r2sys),S=nn(m.r3sys),d=nn(m.r2dia),D=nn(m.r3dia);
  if(!s||!S||!d||!D) return null;
  return {sys:rnd((s+S)/2),dia:rnd((d+D)/2)};
}
// Media de sesión sin redondear, solo para cálculos estadísticos
function smeanRaw(m) {
  const s=nn(m.r2sys),S=nn(m.r3sys),d=nn(m.r2dia),D=nn(m.r3dia);
  if(!s||!S||!d||!D) return null;
  return {sys:(s+S)/2,dia:(d+D)/2};
}
function sessionAna(m) {
  const mn=smean(m); if(!mn) return null;
  const s2=nn(m.r2sys),s3=nn(m.r3sys),d2=nn(m.r2dia),d3=nn(m.r3dia);
  return {
    mean:mn,elevated:mn.sys>=135||mn.dia>=85,
    ascPAS:s3>s2+2,ascPAD:d3>d2+2,
    anomR1Dia:!!(m.r1dia&&nn(m.r1dia)<50),
    anomPP:(mn.sys-mn.dia)<20,
    deltaSys:nn(m.r1sys)?rnd(nn(m.r1sys)-(s2+s3)/2):null,
    deltaDia:nn(m.r1dia)?rnd(nn(m.r1dia)-(d2+d3)/2):null
  };
}
function calcStats(meas) {
  const valid=meas.filter(m=>smeanRaw(m));
  if(!valid.length) return null;

  const aft=valid.filter(m=>m.session==='afternoon');
  const ms=arr=>arr.map(m=>smeanRaw(m));
  const gavg=arr=>({sys:avg(arr.map(x=>x.sys)),dia:avg(arr.map(x=>x.dia))});
  const global=gavg(ms(valid));
  const mornG=morn.length?gavg(ms(morn)):null;
  const aftG=aft.length?gavg(ms(aft)):null;
  const pasList=valid.map(m=>smeanRaw(m).sys);
  const padList=valid.map(m=>smeanRaw(m).dia);
  const mornPasList=morn.map(m=>smeanRaw(m).sys);
  const mornPadList=morn.map(m=>smeanRaw(m).dia);
  const aftPasList=aft.map(m=>smeanRaw(m).sys);
  const aftPadList=aft.map(m=>smeanRaw(m).dia);
  const alerts=valid.filter(m=>nn(m.r1sys)).map(m=>r1(nn(m.r1sys)-(nn(m.r2sys)+nn(m.r3sys))/2));
  const avgOf=arr=>arr.length?rnd(arr.reduce((a,b)=>a+b,0)/arr.length):null;
  const hrs=valid.filter(m=>nn(m.hr)).map(m=>nn(m.hr));
  const mHrs=morn.filter(m=>nn(m.hr)).map(m=>nn(m.hr));
  const aHrs=aft.filter(m=>nn(m.hr)).map(m=>nn(m.hr));
  const elevCount=valid.filter(m=>{const x=smeanRaw(m);return x&&(x.sys>=135||x.dia>=85);}).length;
  const mornElDia=morn.filter(m=>{const x=smeanRaw(m);return x&&x.dia>=85;}).length;
  const alertaDeltas=valid.filter(m=>nn(m.r1sys)).map(m=>({
    date:m.date,session:m.session,
    deltaSys:rnd(nn(m.r1sys)-(nn(m.r2sys)+nn(m.r3sys))/2),
    deltaDia:nn(m.r1dia)?rnd(nn(m.r1dia)-(nn(m.r2dia)+nn(m.r3dia))/2):null
  }));
  return {
    global,mornG,aftG,
    globalEl:global.sys>=135||global.dia>=85,
    mornEl:!!(mornG&&(mornG.sys>=135||mornG.dia>=85)),
    aftEl:!!(aftG&&(aftG.sys>=135||aftG.dia>=85)),
    optimo:global.sys<130&&global.dia<80,

    totalSessions:valid.length,mornCount:morn.length,aftCount:aft.length,

    elevCount,mornElDia,alertaDeltas,
    pasSd:sdv(pasList),padSd:sdv(padList),
    pasMax:pasList.length?rnd(Math.max(...pasList)):null,pasMin:pasList.length?rnd(Math.min(...pasList)):null,
    padMax:padList.length?rnd(Math.max(...padList)):null,padMin:padList.length?rnd(Math.min(...padList)):null,
    mornPasSd:sdv(mornPasList),mornPadSd:sdv(mornPadList),
    aftPasSd:sdv(aftPasList),aftPadSd:sdv(aftPadList),
    mornPasMax:mornPasList.length?rnd(Math.max(...mornPasList)):null,mornPasMin:mornPasList.length?rnd(Math.min(...mornPasList)):null,
    mornPadMax:mornPadList.length?rnd(Math.max(...mornPadList)):null,mornPadMin:mornPadList.length?rnd(Math.min(...mornPadList)):null,
    aftPasMax:aftPasList.length?rnd(Math.max(...aftPasList)):null,aftPasMin:aftPasList.length?rnd(Math.min(...aftPasList)):null,
    aftPadMax:aftPadList.length?rnd(Math.max(...aftPadList)):null,aftPadMin:aftPadList.length?rnd(Math.min(...aftPadList)):null

function buildEvolSVG(sorted,treatments) {
  if(sorted.length<2) return "<p style='text-align:center;color:#aaa;padding:20px;font-size:12px'>M&iacute;nimo 2 sesiones para el gr&aacute;fico</p>";
  const W=920,H=270,pl=70,pr=28,pt=28,pb=60;
  const iW=W-pl-pr,iH=H-pt-pb,minY=55,maxY=165;
  const yf=v=>pt+iH-(v-minY)/(maxY-minY)*iH;
  const xf=i=>sorted.length>1?pl+i*iW/(sorted.length-1):pl+iW/2;
  const pts=[];
  for(let i=0;i<sorted.length;i++){const s=sorted[i],m=smean(s);if(m)pts.push({x:xf(i),sy:yf(m.sys),dy:yf(m.dia),sv:m.sys,session:s.session,date:s.date,el:m.sys>=135||m.dia>=85});}
  const mg=pts.filter(p=>p.session==='morning'),ag=pts.filter(p=>p.session==='afternoon');
  const mkp=arr=>arr.map(p=>p.x.toFixed(0)+','+p.sy.toFixed(0)).join(' ');
  const mkd=arr=>arr.map(p=>p.x.toFixed(0)+','+p.dy.toFixed(0)).join(' ');
  let ln='';
  if(mg.length>1)ln+="<polyline points='"+mkp(mg)+"' fill='none' stroke='#27ae60' stroke-width='2.3' stroke-linejoin='round'/>";
  if(ag.length>1)ln+="<polyline points='"+mkp(ag)+"' fill='none' stroke='#e67e22' stroke-width='2.3' stroke-linejoin='round'/>";
  if(mg.length>1)ln+="<polyline points='"+mkd(mg)+"' fill='none' stroke='#27ae60' stroke-width='1.6' stroke-dasharray='5,3' stroke-linejoin='round'/>";

      rows+="<td class='strikethrough'>"+(m.r1time||'&mdash;')+"</td><td class='strikethrough'>"+(m.r1sys||'&mdash;')+"</td><td class='strikethrough'>"+(m.r1dia||'&mdash;')+ar1+"</td><td class='strikethrough'>"+(m.hr||'&mdash;')+"</td><td class='strikethrough note-cell'>Descartada"+ds+"</td></tr>";

      const r3se=nn(m.r3sys)>=135,r3de=nn(m.r3dia)>=85;const aP=nn(m.r3sys)>nn(m.r2sys)+2,aD=nn(m.r3dia)>nn(m.r2dia)+2;const anPP=ana&&ana.anomPP;
      let f3='&#10003;';if(aP&&aD)f3="&#10003; <span class='paradox'>&#8593;PAS+PAD</span>";else if(aP)f3="&#10003; <span class='paradox'>&#8593;PAS</span>";else if(aD)f3="&#10003; <span class='paradox'>&#8593;PAD</span>";if(anPP)f3+=" <span class='paradox'>&#8224;PP</span>";

    }

}

// ─── Constructor del informe HTML completo ───────────────────────────
function buildReport(meas,info,st,status,obs,treatments) {
  const sorted=[...meas].filter(m=>smean(m)).sort((a,b)=>a.date!==b.date?a.date.localeCompare(b.date):(a.session==='morning'?-1:1));
  const dates=sorted.map(m=>m.date);
  const period=dates.length>0?(fdl(dates[0])+'&ndash;'+fdl(dates[dates.length-1])):'---';
  const hasMG=!!(st&&st.mornG),hasAG=!!(st&&st.aftG);
  const tSorted=treatments?[...treatments].sort((a,b)=>a.date.localeCompare(b.date)):[];
  const semStyle='background:'+status.semColor+';box-shadow:0 0 10px '+status.semColor+'60';
  const semHtml="<div class='semaforo' style='background:"+status.semColor+"15;border:2px solid "+status.semColor+"30'><div class='sem-dot' style='"+semStyle+"'></div><div><div style='font-weight:800;font-size:14px;color:"+status.color+"'>"+status.text+"</div><div style='font-size:11px;color:#888;margin-top:3px'>Media AMPA: "+(st?(st.global.sys+"/"+st.global.dia+" mmHg"):"---")+" &nbsp;|&nbsp; Umbral diagn&oacute;stico: 135/85 mmHg &nbsp;|&nbsp; Objetivo &oacute;ptimo: &lt;130/80 mmHg</div></div></div>";
  const cards=[
    {lbl:"Media Global AMPA",val:st?(st.global.sys+"/"+st.global.dia):"---",sub:"mmHg &nbsp;|&nbsp; umbral &lt;135/85",cls:"c-global",sz:"22px"},
    {lbl:"Media Ma&ntilde;ana",val:hasMG?(st.mornG.sys+"/"+st.mornG.dia):"Sin datos",sub:hasMG?("mmHg &middot; "+st.mornCount+" ses."+(st.mornEl?" !":"")):"-",cls:hasMG&&st.mornEl?"c-morning warn-b":"c-morning",sz:"22px"},
    {lbl:"Media Tarde",val:hasAG?(st.aftG.sys+"/"+st.aftG.dia):"Sin datos",sub:hasAG?("mmHg &middot; "+st.aftCount+" ses."+(st.aftEl?" !":"")):"-",cls:"c-evening",sz:"22px"},
    {lbl:"Control AMPA",val:status.badge,sub:st?(st.validDays+" d&iacute;as &middot; "+st.totalSessions+" ses."):"-",cls:"c-warn",sz:"14px"}
  ];
  let cardHtml='';for(const c of cards)cardHtml+="<div class='card "+c.cls+"'><div class='card-lbl'>"+c.lbl+"</div><div class='card-val' style='font-size:"+c.sz+"'>"+c.val+"</div><div class='card-sub'>"+c.sub+"</div></div>";
  let statsHtml='';
  if(st){
    const rows2=[
      ["Global",st.global.sys,st.global.dia,st.pasSd,st.padSd,st.pasMin&&st.pasMax?(st.pasMin+"&ndash;"+st.pasMax):"&mdash;",st.padMin&&st.padMax?(st.padMin+"&ndash;"+st.padMax):"&mdash;",st.totalSessions],
      ...(st.mornG?[["Ma&ntilde;ana",st.mornG.sys,st.mornG.dia,st.mornPasSd,st.mornPadSd,st.mornPasMin&&st.mornPasMax?(st.mornPasMin+"&ndash;"+st.mornPasMax):"&mdash;","&mdash;",st.mornCount]]:[]),
      ...(st.aftG?[["Tarde",st.aftG.sys,st.aftG.dia,st.aftPasSd,st.aftPadSd,st.aftPasMin&&st.aftPasMax?(st.aftPasMin+"&ndash;"+st.aftPasMax):"&mdash;","&mdash;",st.aftCount]]:[]),
    ];
    statsHtml="<table class='stats-tbl'><thead><tr><th style='text-align:left'>Per&iacute;odo</th><th>PAS media</th><th>PAD media</th><th>PAS DE</th><th>PAD DE</th><th>Rango PAS</th><th>Rango PAD</th><th>Sesiones</th></tr></thead><tbody>";
    for(const r of rows2){statsHtml+="<tr><td>"+r[0]+"</td>"+r.slice(1).map(v=>"<td>"+v+"</td>").join("")+"</tr>";}
    statsHtml+="</tbody></table>";
  }
  let alertaNote='';
  if(st&&st.avgAlert>0)alertaNote="<p style='font-size:11px;color:#777;margin-top:4px'>Efecto de alerta medio: +"+(st.avgAlert)+" mmHg sist&oacute;lica (1&ordf; vs. media 2&ordf;+3&ordf;).</p>";
  let gradLine='';
  if(hasMG&&hasAG){const gP=rnd(Math.abs(st.mornG.sys-st.aftG.sys)),gD=rnd(Math.abs(st.mornG.dia-st.aftG.dia));gradLine="<p style='font-size:11px;color:#777;margin-top:3px'>Gradiente ma&ntilde;ana&ndash;tarde: PAS "+gP+" mmHg &nbsp;|&nbsp; PAD "+gD+" mmHg.</p>";}
  let hrLine='';
  if(st&&st.avgHR){let t=st.avgHR+' lpm';if(st.mornHR&&st.aftHR)t+=' (ma&ntilde;ana: '+st.mornHR+', tarde: '+st.aftHR+')';hrLine="<p style='font-size:11px;color:#777;margin-top:3px'>FC media: "+t+".</p>";}
  let txHtml='';for(const t of tSorted){const cls=t.type==='cambio'?'tx-cambio':'tx-inicio';const lbl=t.type==='cambio'?'Cambio':'Inicio';txHtml+="<div class='tx-item'><span class='tx-badge "+cls+"'>"+lbl+"</span><span><strong>"+fdm(t.date)+"</strong> &mdash; "+t.description+"</span></div>";}
  let obsHtml='';for(const o of obs){const t=o.tipo||'info';obsHtml+="<div class='obs-card "+t+"'><div class='obs-title "+t+"'>"+(o.titulo||'---')+"</div><div class='obs-text'>"+(o.texto||'')+"</div></div>";}
  const methData=[
    ["Protocolo","ESH 2023 / ESC 2024 / SEH-LELHA 2022 &mdash; 3 mediciones/sesi&oacute;n, descarte 1&ordf;, promedio 2&ordf;+3&ordf;"],
    ["Dispositivo",info.device||"No especificado"],
    ["Umbral diagn&oacute;stico AMPA","PAS &ge;135 mmHg y/o PAD &ge;85 mmHg"],
    ["Objetivo &oacute;ptimo ESC 2024","PA domiciliaria &lt;130/80 mmHg"],
    ["Sesiones v&aacute;lidas",st?(st.totalSessions+" ("+st.mornCount+" ma&ntilde;ana + "+st.aftCount+" tarde)"):"---"],
    ["Per&iacute;odo",period],
    ...(st&&st.avgAlert!==undefined?[["Efecto de alerta medio",(st.avgAlert>0?"+":"")+st.avgAlert+" mmHg sist&oacute;lica"]]:[]),
    ...(hasMG&&hasAG?[["Gradiente ma&ntilde;ana&ndash;tarde","PAS "+rnd(Math.abs(st.mornG.sys-st.aftG.sys))+" mmHg &nbsp;|&nbsp; PAD "+rnd(Math.abs(st.mornG.dia-st.aftG.dia))+" mmHg"]]:[]),
    ...(st&&st.avgHR?[["FC media",st.avgHR+" lpm"+(st.mornHR?" (ma&ntilde;ana: "+st.mornHR+", tarde: "+(st.aftHR||"---")+")":" ")]]:[]),
    ...(info.clinicSys?[["PA en consulta",info.clinicSys+"/"+info.clinicDia+" mmHg"]]:[]),
  ];
  let methHtml='';for(const r of methData)methHtml+="<tr><td>"+r[0]+"</td><td>"+r[1]+"</td></tr>";
  const barSection=hasMG&&hasAG?"<div style='margin-top:16px'><div style='font-size:11px;font-weight:600;color:#444;margin-bottom:6px;text-align:center'>Comparativa Ma&ntilde;ana vs. Tarde</div><div style='display:flex;justify-content:center'>"+buildBarSVG(st)+"</div></div>":"";
  const alertaSection=st&&st.alertaDeltas.length>=2?"<div class='section'><div class='section-title'>Efecto de Alerta</div><div style='margin:6px 0'>"+buildAlertaSVG(st.alertaDeltas)+"</div>"+alertaNote+"</div>":"";
  const fcSection=sorted.filter(m=>nn(m.hr)).length>=2?"<div style='margin-top:14px'>"+buildFCSVG(sorted)+"</div>":"";
  const p=[];
  p.push("<!DOCTYPE html><html lang='es'><head><meta charset='UTF-8'><title>Informe AMPA</title><style>"+RCSS+"</style></head><body><div class='page'>");
  p.push("<div class='header'><div><h1>"+pharmLine1()+"</h1>"+(pharmLine2()||pharmLine3()?"<p>"+[pharmLine2(),pharmLine3()].filter(Boolean).join(' &bull; ')+"</p>":"")+"<p style='margin-top:7px;font-weight:700;font-size:15px;color:#1a5276'>INFORME DE AUTOMEDIDA DE PRESI&Oacute;N ARTERIAL (AMPA)</p></div><div class='header-right'><div class='badge'>AMPA</div><br><span>Fecha de emisi&oacute;n:<br><strong>"+todayS()+"</strong></span></div></div>");
  p.push("<div class='section'><div class='section-title'>Datos del Registro</div><div class='patient-grid'><div class='patient-cell'><div class='cell-label'>Paciente</div><div class='cell-value'>"+(info.name||'______________________')+"</div></div><div class='patient-cell'><div class='cell-label'>Per&iacute;odo</div><div class='cell-value'>"+period+"</div></div><div class='patient-cell'><div class='cell-label'>D&iacute;as con medici&oacute;n</div><div class='cell-value'>"+(st?st.validDays:'---')+" d&iacute;as</div></div><div class='patient-cell'><div class='cell-label'>Dispositivo</div><div class='cell-value'>"+(info.device||'No especificado')+"</div></div><div class='patient-cell'><div class='cell-label'>Sesiones v&aacute;lidas</div><div class='cell-value'>"+(st?st.totalSessions+' sesiones':'---')+"</div></div><div class='patient-cell'><div class='cell-label'>Cambios de tratamiento</div><div class='cell-value'>"+(tSorted.length>0?tSorted.filter(t=>t.type==='cambio').length+' cambio(s)':'Ninguno registrado')+"</div></div></div>"+(info.clinicSys?"<p style='font-size:11px;color:#777;margin-top:7px'><strong>PA en consulta:</strong> "+info.clinicSys+"/"+info.clinicDia+" mmHg.</p>":"")+"</div>");
  if(tSorted.length>0)p.push("<div class='section'><div class='section-title'>Evoluci&oacute;n del Tratamiento</div><div class='tx-timeline'>"+txHtml+"</div></div>");
  p.push("<div class='section'><div class='section-title'>Resultados Principales</div>"+semHtml+"<div class='summary-cards'>"+cardHtml+"</div>");
  if(statsHtml)p.push("<div style='margin-top:10px'><div style='font-size:12px;font-weight:700;color:#1a5276;margin-bottom:6px'>Resumen estad&iacute;stico</div>"+statsHtml+"</div>");
  p.push(gradLine+hrLine+"</div>");
  p.push("<div class='section'><div class='section-title'>Registro Detallado de Mediciones</div><table class='main-table'><thead><tr><th>Fecha</th><th>Sesi&oacute;n</th><th>Hora</th><th>PAS (mmHg)</th><th>PAD (mmHg)</th><th>FC (lpm)</th><th>Uso en media</th></tr></thead><tbody>"+buildTableRows(meas,tSorted)+"</tbody></table><p style='font-size:10px;color:#888;margin-top:6px'>1&ordf; lectura descartada (ESH 2023). Se promedian 2&ordf; y 3&ordf;. &Delta; = diferencia 1&ordf; vs. media.</p></div>");
  p.push("<div class='section'><div class='section-title'>Evoluci&oacute;n Temporal</div><div style='margin:6px 0'>"+buildEvolSVG(sorted,tSorted)+"</div>"+barSection+fcSection+"</div>");
  p.push(alertaSection);
  p.push("<div class='section'><div class='section-title'>Observaciones Cl&iacute;nicas</div>"+(obs.length?"<div class='obs-grid'>"+obsHtml+"</div>":"<p style='color:#999;font-style:italic;font-size:12px'>Sin observaciones generadas.</p>")+"</div>");
  p.push("<div class='section'><div class='section-title'>M&eacute;todo y referencias</div><table class='meth'>"+methHtml+"</table>");
  p.push("<div style='font-size:10.5px;color:#444;line-height:2;margin-top:10px'><strong>Referencias</strong><br>(1) McEvoy JW et al. 2024 ESC Guidelines for the management of elevated blood pressure and hypertension. <em>Eur Heart J.</em> 2024;45(38):3912&ndash;4018. doi:10.1093/eurheartj/ehae178<br>(2) Mancia G et al. 2023 ESH Guidelines for the management of arterial hypertension. <em>J Hypertens.</em> 2023;41(12):1874&ndash;2071. doi:10.1097/HJH.0000000000003480<br>(3) Stergiou GS et al. 2021 ESH Practice Guidelines for office and out-of-office blood pressure measurement. <em>J Hypertens.</em> 2021;39(7):1293&ndash;1302. doi:10.1097/HJH.0000000000002843</div></div>");
  p.push("<div class='disclaimer'>&#9888; <strong>AVISO:</strong> Este informe tiene car&aacute;cter informativo y recoge &uacute;nicamente los datos de automedida de presi&oacute;n arterial registrados por el paciente. Los resultados deben ser valorados e interpretados por su m&eacute;dico, quien determinar&aacute; las decisiones cl&iacute;nicas oportunas.</div>");
  p.push("<div class='footer'><div><div class='pharmacy-name'>"+pharmLine1()+"</div>"+(pharmLine2()?"<div>"+pharmLine2()+"</div>":"")+(pharmLine3()?"<div>"+pharmLine3()+"</div>":"")+"<div style='color:#999;font-size:9.5px;margin-top:4px'>Generado con "+APP.name+" v"+APP.version+"</div></div><div><div class='sig-line'>Farmac&eacute;utico/a responsable<br>Fecha de emisi&oacute;n: "+todayS()+"</div></div></div>");
  p.push("</div></body></html>");
  return p.join('');
}

// ─── Helper API ──────────────────────────────────────────────────────
async function callAPI(messages, maxTokens=2000) {
  const hasKey = !!CFG.apiKey;
  const isWorker = CFG.endpoint !== 'https://api.anthropic.com/v1/messages';
  if(!hasKey && !isWorker) {
    throw new Error('Sin API configurada. Introduce tu API key o configura el Worker en la sección de ajustes.');
  }
  const headers = {'Content-Type':'application/json'};
  if(hasKey) {
    headers['x-api-key'] = CFG.apiKey;
    headers['anthropic-version'] = '2023-06-01';
    headers['anthropic-dangerous-direct-browser-access'] = 'true';
  }
  const res = await fetch(CFG.endpoint, {
    method:'POST', headers,
    body:JSON.stringify({model:CFG.model, max_tokens:maxTokens, messages})
  });
  if(!res.ok) throw new Error(`Error API: ${res.status} ${res.statusText}`);
  return res.json();
}

  if(isExcel) btns+=`<button class="btn" style="background:${ST.excelProcessing?'#bbb':'#1e8449'};color:#fff" ${ST.excelProcessing?'disabled':''} onclick="doExtractExcel()">${ST.excelProcessing?'⏳ Procesando Excel...':'📊 Extraer Excel con IA → Mediciones'}</button>`;

  return `<div>
    <div class="card" style="border:2px dashed #2e86c1;background:#f4f9fd">
      <div style="font-weight:800;color:#1a5276;margin-bottom:6px;font-size:14px">🧪 Probar con un caso de ejemplo</div>
      <div style="font-size:12px;color:#555;margin-bottom:10px">Carga un registro <strong>simulado</strong> (no es un paciente real) y muestra el informe al instante, sin introducir datos.</div>
      <div style="display:flex;gap:8px;flex-wrap:wrap;align-items:center">
        <select id="ex-sel" class="inp" style="flex:1;min-width:220px" onchange="_exSel=this.value;render()">${EXAMPLES.map(e=>`<option value="${e.id}" ${_exSel===e.id?'selected':''}>${e.id} · ${esc(e.nombre)}</option>`).join('')}</select>
        <button class="btn" style="background:#2e86c1;color:#fff" onclick="loadExample(_exSel)">Cargar ejemplo</button>
      </div>
      <div style="font-size:11px;color:#777;margin-top:8px">${esc((EXAMPLES.find(e=>e.id===_exSel)||{}).desc||'')}</div>
      ${_replaceArmed?`<div style="color:#922b21;background:#fdecea;border-radius:6px;padding:8px 12px;font-size:12px;margin-top:8px">Hay mediciones introducidas. Pulse «Cargar ejemplo» otra vez para sustituirlas por el caso simulado.</div>`:''}
      ${ST.isExample?`<div style="color:#1e8449;font-size:12px;margin-top:8px">✓ Cargado el caso simulado ${ST.isExample}. ${esc((EXAMPLES.find(e=>e.id===ST.isExample)||{}).nota||'')}</div>`:''}
    </div>
    <div class="card">
      <div style="font-weight:800;color:#1a5276;margin-bottom:12px;font-size:14px">📎 Foto o Excel del registro</div>
      <div class="drop-zone${ST.dragging?' drag-over':''}"
        onclick="document.getElementById('fileInput').click()"
        ondragover="event.preventDefault();ST.dragging=true;this.classList.add('drag-over')"
        ondragleave="ST.dragging=false;this.classList.remove('drag-over')"
        ondrop="event.preventDefault();this.classList.remove('drag-over');handleFileChange(event.dataTransfer.files[0])">
        ${zoneContent}
      </div>
      ${ST.extractErr?`<div style="color:#e74c3c;font-size:12px;margin-top:10px;padding:8px 12px;background:#ffeaea;border-radius:6px">${ST.extractErr}</div>`:''}
      <div style="display:flex;gap:10px;margin-top:14px;flex-wrap:wrap">${btns}</div>
      ${apiNote}
      ${isImg?`<div style="background:#fdecea;border:1px solid #e74c3c;border-radius:6px;padding:8px 12px;font-size:11px;color:#922b21;margin-top:10px">🔒 <strong>Privacidad:</strong> al extraer datos de una foto, la imagen se envía a un servicio de IA externo (Anthropic). Antes de subirla, tape o recorte el nombre del paciente y cualquier otro dato identificativo.</div>`:''}
      <div style="font-size:11px;color:#777;margin-top:8px;line-height:1.5">ℹ️ Los cálculos, alertas, gráficos e informes se generan en este navegador; la herramienta no guarda datos de pacientes en ningún servidor. Las funciones IA opcionales (extracción de foto o Excel y borrador de observaciones) envían al servicio de IA las mediciones, fechas y tratamiento, sin el nombre del paciente. El borrador de observaciones debe revisarlo y validarlo el farmacéutico.</div>
    </div>

    <div class="card">
      <div style="font-weight:800;color:#1a5276;margin-bottom:6px;font-size:14px">Datos del establecimiento <span style="font-weight:600;color:#999;font-size:12px">(opcional)</span></div>
      <div style="font-size:11px;color:#888;margin-bottom:10px">Aparecen en la cabecera y el pie del informe. Se guardan solo en este navegador.</div>
      <div style="display:grid;grid-template-columns:repeat(auto-fit,minmax(190px,1fr));gap:12px">
        <div><label class="lbl">Farmacia</label><input id="ph-name" class="inp" style="width:100%" value="${esc(PHARM.name)}" placeholder="Nombre de la farmacia" oninput="PHARM.name=this.value;savePharm()"></div>
        <div><label class="lbl">Teléfono</label><input id="ph-phone" class="inp" style="width:100%" value="${esc(PHARM.phone)}" oninput="PHARM.phone=this.value;savePharm()"></div>
        <div><label class="lbl">Localidad / dirección</label><input id="ph-address" class="inp" style="width:100%" value="${esc(PHARM.address)}" oninput="PHARM.address=this.value;savePharm()"></div>
        <div><label class="lbl">Farmacéutico/a</label><input id="ph-pharmacist" class="inp" style="width:100%" value="${esc(PHARM.pharmacist)}" oninput="PHARM.pharmacist=this.value;savePharm()"></div>
        <div><label class="lbl">N.º colegiado</label><input id="ph-license" class="inp" style="width:100%" value="${esc(PHARM.license)}" oninput="PHARM.license=this.value;savePharm()"></div>
      </div>
    </div>

    <!-- Configuración API (oculta por defecto) -->
    <div id="api-config" class="card" style="display:none;border:2px solid #1a5276">
      <div style="font-weight:800;color:#1a5276;margin-bottom:12px;font-size:14px">⚙️ Configuración API</div>
      <div style="font-size:12px;color:#555;margin-bottom:10px">Introduce tu API key de <a href="https://console.anthropic.com" target="_blank" style="color:#1a5276">console.anthropic.com</a> para activar las funciones IA. Coste: ~0,01-0,03 € por informe.</div>
      <div style="display:flex;gap:8px;align-items:center;flex-wrap:wrap">
        <input id="apiKeyInput" class="inp" style="flex:1;min-width:220px;font-family:monospace" placeholder="sk-ant-api03-..." value="${esc(CFG.apiKey)}" oninput="CFG.apiKey=this.value">
        <input id="workerInput" class="inp" style="flex:1;min-width:220px;font-family:monospace;font-size:11px" placeholder="https://mi-worker.workers.dev (opcional)" value="${CFG.endpoint!=='https://api.anthropic.com/v1/messages'?esc(CFG.endpoint):''}" oninput="if(this.value)CFG.endpoint=this.value;else CFG.endpoint='https://api.anthropic.com/v1/messages'">
        <button class="btn" style="background:#1a5276;color:#fff" onclick="render()">Guardar</button>
      </div>
    </div>

    <div class="card">
      <div style="font-weight:800;color:#1a5276;margin-bottom:14px;font-size:14px">Datos del paciente</div>
      <div style="display:grid;grid-template-columns:repeat(auto-fit,minmax(190px,1fr));gap:12px">
        <div><label class="lbl">Nombre / Referencia</label><input id="info-name" class="inp" style="width:100%" value="${esc(ST.info.name)}" placeholder="Dejar en blanco (protección de datos)" oninput="ST.info.name=this.value"></div>
        <div><label class="lbl">Tensiómetro</label><input id="info-device" class="inp" style="width:100%" value="${esc(ST.info.device)}" placeholder="Ej: Omron M3" oninput="ST.info.device=this.value"></div>
        <div><label class="lbl">PA en consulta (mmHg)</label>
          <div style="display:flex;gap:6px;align-items:center">
            <input id="info-csys" class="inp" style="width:68px" value="${esc(ST.info.clinicSys)}" placeholder="Sist." oninput="ST.info.clinicSys=this.value">
            <span style="color:#aaa;font-weight:700">/</span>
            <input id="info-cdia" class="inp" style="width:68px" value="${esc(ST.info.clinicDia)}" placeholder="Diast." oninput="ST.info.clinicDia=this.value">
          </div>
        </div>
      </div>
    </div>

    ${buildTreatmentsCard()}

    <div style="text-align:right">
      <button class="btn" style="background:#1a5276;color:#fff;padding:11px 28px" onclick="setTab(1)">Ir a Mediciones →</button>
    </div>
  </div>`;
}

function buildTreatmentsCard() {
  const tSorted=[...ST.treatments].sort((a,b)=>a.date.localeCompare(b.date));
  let txRows='';
  for(const t of tSorted){
    const col=t.type==='cambio'?'#b7770d':'#8e44ad';
    const bc=t.type==='cambio'?'#fef5e7':'#f5eef8';
    const bord=t.type==='cambio'?'#e67e22':'#8e44ad';
    txRows+=`<div style="display:flex;gap:8px;margin-bottom:10px;align-items:center;flex-wrap:wrap">
      <span class="tx-badge" style="background:${bc};color:${col};border:1px solid ${bord}" onclick="toggleTxType('${t.id}')">${t.type==='cambio'?'🔄 Cambio':'🟣 Inicio'}</span>
      <input type="date" value="${t.date}" style="padding:5px 4px;border:1px solid #ccc;border-radius:5px;font-size:12px" oninput="updTx('${t.id}','date',this.value)">
      <input value="${esc(t.description)}" class="inp" style="flex:1;min-width:180px" placeholder="Ej: Enalapril 10 mg/24h" oninput="updTx('${t.id}','description',this.value)">
      <button class="btn" style="background:#fdecea;color:#c0392b;padding:5px 10px;font-size:12px" onclick="delTx('${t.id}')">✕</button>
    </div>`;
  }
  return `<div class="card">
    <div style="font-weight:800;color:#1a5276;margin-bottom:14px;font-size:14px">💊 Tratamiento farmacológico <span style="font-weight:400;font-size:12px;color:#888">${ST.treatments.length>0?ST.treatments.length+' entrada(s)':''}</span></div>
    ${txRows}
    <div style="display:flex;gap:8px;margin-top:8px;flex-wrap:wrap">
      <button class="btn" style="background:#8e44ad;color:#fff;padding:7px 16px" onclick="addTx('inicial')">+ Inicio de tratamiento</button>
      <button class="btn" style="background:#e67e22;color:#fff;padding:7px 16px" onclick="addTx('cambio')">+ Cambio de tratamiento</button>
    </div>
  </div>`;
}

function buildTab1() {
  const st=calcStats(ST.meas);
  const status=getStatus(st,ST.info.clinicSys,ST.info.clinicDia);
  const tSorted=[...ST.treatments].sort((a,b)=>a.date.localeCompare(b.date));

  let statsBar='';
  if(st) {
    const chips=[
      {l:'Global AMPA',v:st.global.sys+'/'+st.global.dia,c:st.globalEl?'#c0392b':'#1a5276'},
      ...(st.mornG?[{l:'Mañana',v:st.mornG.sys+'/'+st.mornG.dia,c:st.mornEl?'#c0392b':'#27ae60'}]:[]),
      ...(st.aftG?[{l:'Tarde',v:st.aftG.sys+'/'+st.aftG.dia,c:st.aftEl?'#c0392b':'#e67e22'}]:[]),
      {l:'Días válidos',v:st.validDays+'d / '+st.totalSessions+'ses.',c:'#8e44ad'},
    ];
    statsBar=`<div id="stats-overlay" class="card" style="padding:10px 14px;margin-bottom:12px">
      ${buildSemaforoHTML(status)}
      <div style="display:flex;flex-wrap:wrap;gap:8px">
        ${chips.map(c=>`<div style="display:flex;gap:6px;align-items:center;padding:4px 10px;background:${c.c}12;border:1.5px solid ${c.c}30;border-radius:7px"><span style="font-size:10px;color:#888;font-weight:700;text-transform:uppercase;white-space:nowrap">${c.l}</span><span style="font-size:13px;font-weight:800;color:${c.c};white-space:nowrap">${c.v}</span></div>`).join('')}
      </div>
    </div>`;
  } else {
    statsBar=`<div id="stats-overlay"></div>`;
  }

  let txBar='';
  if(tSorted.length>0){
    txBar=`<div style="background:#faf5ff;border:1px solid #d8b4fe;border-radius:10px;padding:10px 14px;margin-bottom:12px">
      <div style="font-weight:700;color:#7c3aed;font-size:12px;margin-bottom:6px">💊 Tratamiento</div>
      <div style="display:flex;flex-wrap:wrap;gap:8px;align-items:center">
        ${tSorted.map((t,i)=>`${i>0?"<span style='color:#aaa;font-size:14px'>→</span>":''}<span style="background:${t.type==='cambio'?'#fef5e7':'#f5eef8'};color:${t.type==='cambio'?'#b7770d':'#8e44ad'};border:1px solid ${t.type==='cambio'?'#e67e22':'#8e44ad'};border-radius:5px;padding:3px 8px;font-size:11px;font-weight:700">${t.type==='cambio'?'🔄':'🟣'} ${fds(t.date)}: ${esc(t.description)}</span>`).join('')}
      </div>
    </div>`;
  }

  let measCards='';
  for(const m of ST.meas){
    const mn=smean(m);
    const isMorn=m.session==='morning';
    const sc=isMorn?'#27ae60':'#e67e22';
    const ana=sessionAna(m);
    const mnEl=mn&&(mn.sys>=135||mn.dia>=85);
    const txOnDate=tSorted.filter(t=>t.date===m.date);

    let txBadges='';
    for(const t of txOnDate){
      const col=t.type==='cambio'?'#b7770d':'#8e44ad';const bord=t.type==='cambio'?'#e67e22':'#8e44ad';
      txBadges+=`<div style="background:${t.type==='cambio'?'#fef5e7':'#f5eef8'};border:1px solid ${bord};border-radius:8px;padding:6px 14px;margin-bottom:6px;display:flex;align-items:center;gap:10px;font-size:12px"><span style="font-weight:700;color:${col}">${t.type==='cambio'?'🔄 Cambio':'🟣 Inicio'}</span><span style="color:#555">${esc(t.description)}</span></div>`;
    }

    const r2se=nn(m.r2sys)>=135,r2de=nn(m.r2dia)>=85;
    const r3se=nn(m.r3sys)>=135,r3de=nn(m.r3dia)>=85;
    let f3='OK';
    if(nn(m.r3sys)>nn(m.r2sys)+2&&nn(m.r3dia)>nn(m.r2dia)+2)f3='OK ↑PAS+PAD';
    else if(nn(m.r3sys)>nn(m.r2sys)+2)f3='OK ↑PAS';
    else if(nn(m.r3dia)>nn(m.r2dia)+2)f3='OK ↑PAD';
    if(ana&&ana.anomPP)f3+=' †PP';

    measCards+=`
    ${txBadges}
    <div class="card" style="border-left:4px solid ${sc};margin-bottom:10px">
      <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:12px;flex-wrap:wrap;gap:8px">
        <div style="display:flex;gap:8px;align-items:center;flex-wrap:wrap">
          <input type="date" value="${m.date}" style="padding:5px 4px;border:1px solid #ccc;border-radius:5px;font-size:12px;width:130px" onchange="onMeasChg('${m.id}','date',this.value)">
          <select style="padding:5px 4px;border:1px solid #ccc;border-radius:5px;font-size:12px;color:${sc};font-weight:700;width:110px" onchange="onMeasChg('${m.id}','session',this.value)">
            <option value="morning" ${m.session==='morning'?'selected':''}>☀ Mañana</option>
            <option value="afternoon" ${m.session==='afternoon'?'selected':''}>🌙 Tarde</option>
          </select>
          <div style="display:flex;align-items:center;gap:4px"><span style="font-size:11px;color:#999">FC:</span><input class="ni" value="${m.hr||''}" placeholder="lpm" oninput="onMeasInp('${m.id}','hr',this.value)"></div>
        </div>
        <div style="display:flex;gap:8px;align-items:center">
          ${mn?`<div style="background:${mnEl?'#fdecea':'#eafaf1'};border:1.5px solid ${mnEl?'#e74c3c':'#27ae60'};padding:4px 12px;border-radius:6px;font-weight:800;font-size:15px;color:${mnEl?'#c0392b':'#1e8449'}">${mn.sys}/${mn.dia} <span style="font-size:10px;font-weight:400">mmHg</span></div>`:''}
          ${ana&&ana.deltaSys!==null?`<div style="background:#f5eef8;border:1px solid #8e44ad40;border-radius:6px;padding:4px 8px;font-size:11px;color:#8e44ad;font-weight:700">Δ${ana.deltaSys>0?'+':''}${ana.deltaSys}</div>`:''}
          <button class="btn" style="background:#fdecea;color:#c0392b;padding:5px 10px;font-size:12px" onclick="delMeas('${m.id}')">✕</button>
        </div>
      </div>
      <div style="display:grid;grid-template-columns:36px 90px 60px 60px 70px;gap:4px 8px;align-items:center">
        <div style="font-weight:700;color:#aaa;font-size:10px;text-transform:uppercase"></div>
        <div style="font-weight:700;color:#aaa;font-size:10px;text-transform:uppercase">Hora</div>
        <div style="font-weight:700;color:#aaa;font-size:10px;text-transform:uppercase;text-align:center">SYS</div>
        <div style="font-weight:700;color:#aaa;font-size:10px;text-transform:uppercase;text-align:center">DIA</div>
        <div style="font-weight:700;color:#aaa;font-size:10px;text-transform:uppercase">Estado</div>

        <div style="font-weight:700;color:#ccc;font-size:11px">1ª</div>
        <input class="ti" value="${m.r1time||''}" type="time" style="opacity:.5" oninput="onMeasInp('${m.id}','r1time',this.value)">
        <input class="ni" value="${m.r1sys||''}" placeholder="SYS" style="opacity:.5" oninput="onMeasInp('${m.id}','r1sys',this.value)">
        <input class="ni" value="${m.r1dia||''}" placeholder="DIA" style="opacity:.5" oninput="onMeasInp('${m.id}','r1dia',this.value)">
        <div style="font-size:10px;color:#ccc;text-decoration:line-through">descartada</div>

        <div style="font-weight:700;color:${sc};font-size:11px">2ª</div>
        <input class="ti" value="${m.r2time||''}" type="time" oninput="onMeasInp('${m.id}','r2time',this.value)">
        <input class="ni" value="${m.r2sys||''}" placeholder="SYS" style="border-color:${r2se?'#e74c3c':'#ccc'}" oninput="onMeasInp('${m.id}','r2sys',this.value)">
        <input class="ni" value="${m.r2dia||''}" placeholder="DIA" style="border-color:${r2de?'#e74c3c':'#ccc'}" oninput="onMeasInp('${m.id}','r2dia',this.value)">
        <div style="font-size:10px;color:#aaa">✓</div>

        <div style="font-weight:700;color:${sc};font-size:11px">3ª</div>
        <input class="ti" value="${m.r3time||''}" type="time" oninput="onMeasInp('${m.id}','r3time',this.value)">
        <input class="ni" value="${m.r3sys||''}" placeholder="SYS" style="border-color:${r3se?'#e74c3c':'#ccc'}" oninput="onMeasInp('${m.id}','r3sys',this.value)">
        <input class="ni" value="${m.r3dia||''}" placeholder="DIA" style="border-color:${r3de?'#e74c3c':'#ccc'}" oninput="onMeasInp('${m.id}','r3dia',this.value)">
        <div style="font-size:10px;color:#aaa">${f3}</div>
      </div>
      ${ana&&ana.anomR1Dia?`<div style="font-size:10px;color:#8e44ad;margin-top:6px">* PAD anómala en 1ª lectura (&lt;50 mmHg) — descartada por protocolo.</div>`:''}
      ${ana&&ana.anomPP?`<div style="font-size:10px;color:#8e44ad;margin-top:4px">† Presión de pulso &lt;20 mmHg — valor potencialmente artefactual.</div>`:''}
    </div>`;
  }

  return `<div>
    ${statsBar}
    ${txBar}
    <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:10px">
      <div style="font-weight:800;color:#1a5276;font-size:14px">${ST.meas.length} sesión(es)</div>
      <button class="btn" style="background:#27ae60;color:#fff;padding:7px 16px" onclick="addMeas()">+ Añadir sesión</button>
    </div>
    ${measCards}
    <div style="text-align:right;margin-top:8px">
      <button class="btn" style="background:#1a5276;color:#fff;padding:11px 28px" ${!ST.meas.length?'disabled':''} onclick="setTab(2)">Ver Informe →</button>
    </div>
  </div>`;
}

function buildTab2() {
  const st=calcStats(ST.meas);
  const status=getStatus(st,ST.info.clinicSys,ST.info.clinicDia);
  const sorted=[...ST.meas].filter(m=>smean(m)).sort((a,b)=>a.date!==b.date?a.date.localeCompare(b.date):(a.session==='morning'?-1:1));
  const tSorted=[...ST.treatments].sort((a,b)=>a.date.localeCompare(b.date));

  const obsCol={alert:'#c0392b',warn:'#b7770d',info:'#1a5276',ok:'#1e8449',note:'#6c3483'};
  const obsBg={alert:'#fdedec',warn:'#fef8f0',info:'#f0f6fb',ok:'#f0faf4',note:'#f8f0fb'};

  let obsSection='';
  if(ST.loadObs){
    obsSection=`<div class="card" style="text-align:center;padding:24px;color:#1a5276;font-weight:700">⏳ Generando observaciones clínicas con IA...</div>`;
  } else if(ST.obs.length>0){
    obsSection=`<div class="card"><div style="font-weight:800;color:#1a5276;margin-bottom:12px;font-size:13px">🔬 Observaciones Clínicas</div>
    <div style="display:grid;grid-template-columns:repeat(auto-fit,minmax(280px,1fr));gap:10px">
      ${ST.obs.map(o=>{const t=o.tipo||'info';return`<div style="background:${obsBg[t]||obsBg.info};border-left:4px solid ${obsCol[t]||obsCol.info};border-radius:6px;padding:10px 14px"><div style="font-weight:700;color:${obsCol[t]||obsCol.info};font-size:12px;text-transform:uppercase;margin-bottom:6px">${o.titulo||o.title||''}</div><div style="font-size:12.5px;color:#444;line-height:1.6">${o.texto||o.text||''}</div></div>`;}).join('')}
    </div></div>`;
  }

  let statsCards='';
  if(st){
    const chips=[
      {l:'Media Global',v:st.global.sys+'/'+st.global.dia,u:'mmHg',c:st.globalEl?'#c0392b':'#1a5276'},

      ...(st.aftG?[{l:'Tarde',v:st.aftG.sys+'/'+st.aftG.dia,u:'mmHg',c:st.aftEl?'#c0392b':'#e67e22'}]:[]),
      {l:'Días válidos',v:String(st.validDays),u:st.totalSessions+' sesiones',c:'#8e44ad'},
      ...(st.avgHR?[{l:'FC media',v:String(st.avgHR),u:'lpm',c:'#555'}]:[]),
    ];
    statsCards=`<div style="display:flex;flex-wrap:wrap;gap:10px;margin-bottom:14px">
      ${chips.map(c=>`<div style="flex:1;min-width:100px;background:#fff;border:2px solid ${c.c}20;border-top:4px solid ${c.c};border-radius:10px;padding:10px 8px;text-align:center"><div style="font-size:10px;font-weight:700;color:#999;text-transform:uppercase;margin-bottom:4px">${c.l}</div><div style="font-size:22px;font-weight:900;color:${c.c};line-height:1">${c.v}</div><div style="font-size:10px;color:#bbb;margin-top:2px">${c.u}</div></div>`).join('')}
    </div>`;
  }

  let statsTable='';
  if(st){
    const rows=[
      {l:'Global',sys:st.global.sys,dia:st.global.dia,pSd:st.pasSd,dSd:st.padSd,pRng:st.pasMin&&st.pasMax?(st.pasMin+'–'+st.pasMax):'—',n:st.totalSessions},
      ...(st.mornG?[{l:'Mañana',sys:st.mornG.sys,dia:st.mornG.dia,pSd:st.mornPasSd,dSd:st.mornPadSd,pRng:st.mornPasMin&&st.mornPasMax?(st.mornPasMin+'–'+st.mornPasMax):'—',n:st.mornCount}]:[]),
      ...(st.aftG?[{l:'Tarde',sys:st.aftG.sys,dia:st.aftG.dia,pSd:st.aftPasSd,dSd:st.aftPadSd,pRng:st.aftPasMin&&st.aftPasMax?(st.aftPasMin+'–'+st.aftPasMax):'—',n:st.aftCount}]:[]),
    ];
    statsTable=`<div class="card"><div style="font-weight:800;color:#1a5276;margin-bottom:6px;font-size:13px">Resumen estadístico</div>
    <table style="width:100%;border-collapse:collapse;font-size:11.5px">
      <thead><tr style="background:#1a5276;color:#fff">${['Período','PAS media','PAD media','PAS DE','PAD DE','Rango PAS','Sesiones'].map(h=>`<th style="padding:6px 8px;text-align:center;font-size:11px">${h}</th>`).join('')}</tr></thead>
      <tbody>${rows.map((r,i)=>`<tr style="background:${i%2?'#f9fbff':'#fff'}">${[r.l,r.sys+' mmHg',r.dia+' mmHg','±'+r.pSd,'±'+r.dSd,r.pRng,r.n].map((v,j)=>`<td style="padding:5px 8px;text-align:${j===0?'left':'center'};border-bottom:1px solid #eee;font-weight:${j===0?700:400};color:${j===0?'#1a5276':'#333'}">${v}</td>`).join('')}</tr>`).join('')}</tbody>
    </table></div>`;
  }

  let clinSummary='';
  if(st){
    const rows2=[
      ['Efecto de alerta medio',(st.avgAlert>0?'+':'')+st.avgAlert+' mmHg sistólica (1ª vs. media 2ª+3ª)'],
      ...(st.mornG&&st.aftG?[['Gradiente mañana–tarde','PAS '+rnd(Math.abs(st.mornG.sys-st.aftG.sys))+' mmHg · PAD '+rnd(Math.abs(st.mornG.dia-st.aftG.dia))+' mmHg']]:[]),
      ['Sesiones por encima del umbral',st.elevCount+' de '+st.totalSessions],
      ...(st.mornCount?[['Mañanas con PAD ≥85 mmHg',st.mornElDia+' de '+st.mornCount]]:[]),
      ['Variabilidad PAS (DE global)','±'+st.pasSd+' mmHg · rango: '+(st.pasMin||'—')+'–'+(st.pasMax||'—')+' mmHg'],
      ...(st.avgHR?[['FC media global',st.avgHR+' lpm'+(st.mornHR?' (mañana '+st.mornHR+', tarde '+(st.aftHR||'—')+')':'')]]:[])
    ];
    clinSummary=`<div class="card"><div style="font-weight:800;color:#1a5276;margin-bottom:8px;font-size:13px">Resumen clínico</div>
    ${rows2.map(pair=>`<div style="display:flex;justify-content:space-between;padding:5px 0;border-bottom:1px solid #f0f0f0;font-size:13px"><span style="color:#666">${pair[0]}</span><span style="font-weight:700;color:#1a5276">${pair[1]}</span></div>`).join('')}

  }

  let txCard='';
  if(tSorted.length>0){
    txCard=`<div class="card" style="border-left:4px solid #8e44ad;background:#faf5ff">
      <div style="font-weight:800;color:#7c3aed;margin-bottom:10px;font-size:13px">💊 Evolución del tratamiento</div>
      ${tSorted.map(t=>`<div style="display:flex;align-items:flex-start;gap:10px;margin-bottom:8px;font-size:13px"><span style="background:${t.type==='cambio'?'#fef5e7':'#f5eef8'};color:${t.type==='cambio'?'#b7770d':'#8e44ad'};border:1px solid ${t.type==='cambio'?'#e67e22':'#8e44ad'};border-radius:4px;padding:2px 8px;font-size:11px;font-weight:700;white-space:nowrap">${t.type==='cambio'?'🔄 Cambio':'🟣 Inicio'}</span><span><strong>${fdm(t.date)}</strong> — ${esc(t.description)}</span></div>`).join('')}
    </div>`;
  }

  let charts='';
  if(sorted.length>=2){
    charts+=`<div class="card"><div style="font-weight:800;color:#1a5276;margin-bottom:10px;font-size:13px">📈 Evolución temporal — PAS y PAD</div>${buildEvolSVG(sorted,tSorted)}</div>`;

      </button>

    </div>
    ${st?buildSemaforoHTML(status):''}
    ${statsCards}
    ${statsTable}
    ${clinSummary}
    ${txCard}
    ${charts}
    ${obsSection}
    <div style="background:#fff8e1;border:1px solid #ffe082;border-radius:10px;padding:14px;font-size:12px;color:#5d4037;margin-bottom:14px">
      ⚠️ <strong>AVISO:</strong> Este informe tiene carácter informativo. Los resultados deben ser valorados e interpretados por el médico, quien determinará las decisiones clínicas oportunas.
    </div>
    <div style="text-align:center;padding:10px 0;border-top:2px solid #1a5276">
      <div style="font-weight:700;color:#1a5276;font-size:14px">${pharmLine1()}</div>

      ${pharmLine3()?`<div style="font-size:12px;color:#888;margin-top:2px">${pharmLine3()}</div>`:''}
      <div style="font-size:10px;color:#aaa;margin-top:4px">Generado con ${APP.name} v${APP.version}</div>
    </div>
  </div>`;
}

// ─── Render principal ────────────────────────────────────────────────
function render() {
  saveFoc();
  const TABS=['1. Datos y Foto','2. Mediciones','3. Informe'];
  const tabBtns=TABS.map((t,i)=>`<button class="tab-btn" style="background:${ST.tab===i?'#fff':'transparent'};color:${ST.tab===i?'#1a5276':'rgba(255,255,255,.85)'};font-weight:${ST.tab===i?800:600}" onclick="setTab(${i})">${t}</button>`).join('');
  const content=ST.tab===0?buildTab0():ST.tab===1?buildTab1():buildTab2();
  document.getElementById('app').innerHTML=`
    <div style="background:linear-gradient(135deg,#1a5276,#2e86c1);padding:14px 16px 0">
      <div style="font-size:17px;font-weight:900;color:#fff;margin-bottom:10px">${APP.name} <span style="font-weight:600;font-size:12px;opacity:.8">v${APP.version} · Informes de AMPA</span>${PHARM.name?' <span style="font-weight:600;font-size:13px;opacity:.9">· '+esc(PHARM.name)+'</span>':''}</div>
      <div style="display:flex;gap:2px">${tabBtns}</div>
    </div>
    <div style="max-width:900px;margin:0 auto;padding:14px">${content}</div>
  `;
  restoreFoc();
}

function setTab(i) {
  ST.tab=i;
  if(i===2 && ST.obs.length===0 && ST.meas.filter(m=>smean(m)).length>0 && !ST.loadObs) {
    render();
    genObs();
  } else {
    render();
  }
}

// ─── Manejo de archivos ──────────────────────────────────────────────
function handleFileChange(file) {
  if(!file) return;
  _fileRef=file;
  if(file.name.match(/\.(xlsx|xls)$/i)){
    _imgUrl=null;ST.imgData=null;ST.extractErr='';
    const r=new FileReader();
    r.onload=ev=>{
      try{const wb=XLSX.read(ev.target.result);const ws=wb.Sheets[wb.SheetNames[0]];const rows=XLSX.utils.sheet_to_json(ws,{header:1,defval:''});ST.excelRows=rows.length;}
      catch(e){ST.excelRows=0;}
      render();
    };
    r.readAsArrayBuffer(file);
  } else if(file.type.startsWith('image/')){
    _imgUrl=URL.createObjectURL(file);ST.extractErr='';ST.excelRows=0;
    const r=new FileReader();
    r.onload=ev=>{ST.imgData=ev.target.result.split(',')[1];ST.imgType=file.type;render();};
    r.readAsDataURL(file);
  }
}

async function doExtractPhoto() {
  if(!ST.imgData){return;}
  ST.extracting=true;ST.extractErr='';render();
  try{
    const d=await callAPI([{role:'user',content:[
      {type:'image',source:{type:'base64',media_type:ST.imgType,data:ST.imgData}},
      {type:'text',text:'Extrae de esta imagen AMPA: (1) todas las mediciones y (2) tratamientos con fechas. Mediciones: date YYYY-MM-DD (2026 si no consta), session morning/afternoon, r1/r2/r3 con sys dia time HH:MM (null si no), hr FC. Tratamientos: date YYYY-MM-DD, description, type: inicial o cambio. SOLO JSON sin backticks: {"measurements":[{"date":"2026-04-01","session":"morning","r1sys":145,"r1dia":92,"r1time":"10:00","r2sys":138,"r2dia":88,"r2time":"10:02","r3sys":136,"r3dia":86,"r3time":"10:04","hr":72}],"treatments":[],"notes":""}'}
    ]}],3000);
    const txt=(d.content||[]).map(c=>c.text||'').join('');
    const parsed=JSON.parse(txt.replace(/```json|```/g,'').trim());
    ST.meas=(parsed.measurements||[]).map((m,i)=>({...m,id:Date.now()+i,r1time:m.r1time||'',r2time:m.r2time||'',r3time:m.r3time||''}));

    ST.obs=[];ST.tab=1;
  }catch(e){ST.extractErr='Error al extraer: '+e.message+'. Revisa la foto o introduce manualmente.';}
  ST.extracting=false;render();
}

async function doExtractExcel() {

    const preview=JSON.stringify(rows.slice(0,50));

    const txt=(d.content||[]).map(c=>c.text||'').join('');
    const parsed=JSON.parse(txt.replace(/```json|```/g,'').trim());
    ST.meas=(parsed.measurements||[]).map((m,i)=>({...m,id:Date.now()+i,r1time:m.r1time||'',r2time:m.r2time||'',r3time:m.r3time||''}));

  }catch(e){ST.extractErr='Error al procesar el Excel: '+e.message;}
  ST.excelProcessing=false;render();
}

// ─── Generación de observaciones ─────────────────────────────────────
async function fetchObs() {
  const st=calcStats(ST.meas);if(!st) return [];
  const status=getStatus(st,ST.info.clinicSys,ST.info.clinicDia);
  try{
    const sorted=[...ST.meas].filter(m=>smean(m)).sort((a,b)=>a.date!==b.date?a.date.localeCompare(b.date):(a.session==='morning'?-1:1));
    const tSorted=[...ST.treatments].sort((a,b)=>a.date.localeCompare(b.date));
    const elevCount=sorted.filter(m=>{const me=smean(m);return me&&(me.sys>=135||me.dia>=85);}).length;
    const gP=st.mornG&&st.aftG?rnd(Math.abs(st.mornG.sys-st.aftG.sys)):null;
    const gD=st.mornG&&st.aftG?rnd(Math.abs(st.mornG.dia-st.aftG.dia)):null;
    const sessLines=[];
    for(const m of sorted){
      const me=smean(m);const fl=[];
      if(nn(m.r3sys)>nn(m.r2sys)+2)fl.push('PAS+');if(nn(m.r3dia)>nn(m.r2dia)+2)fl.push('PAD+');
      const elMark=me&&(me.sys>=135||me.dia>=85)?' [ELEVADA]':'';
      const flMark=fl.length?' ['+fl.join(',')+']':'';
      const txMark=tSorted.filter(t=>t.date===m.date).map(t=>' ['+t.type.toUpperCase()+': '+t.description+']').join('');
      const dSys=nn(m.r1sys)?(' delta=+'+(rnd(nn(m.r1sys)-(nn(m.r2sys)+nn(m.r3sys))/2))):'';
      sessLines.push('  - '+fdm(m.date)+' '+(m.session==='morning'?'Manana':'Tarde')+': '+(me?me.sys+'/'+me.dia:'---')+' mmHg'+elMark+flMark+txMark+dSys);
    }
    const txDesc=tSorted.map(t=>(t.type==='cambio'?'CAMBIO':'INICIO')+' ('+fdm(t.date)+'): '+t.description).join(' --> ');
    const prompt=[
      'Eres farmaceutico comunitario especialista en HTA. Redacta 5-7 observaciones clinicas para un informe AMPA.',
      'Media global: '+st.global.sys+'/'+st.global.dia+' mmHg. Estado: '+status.text,
      st.mornG?'Media manana: '+st.mornG.sys+'/'+st.mornG.dia+' mmHg (DE PAS:'+st.mornPasSd+') '+(st.mornEl?'ELEVADA':'OK'):'',
      st.aftG?'Media tarde: '+st.aftG.sys+'/'+st.aftG.dia+' mmHg (DE PAS:'+st.aftPasSd+') '+(st.aftEl?'ELEVADA':'OK'):'',
      'Sesiones totales: '+st.totalSessions+'. Dias validos: '+st.validDays+'.',
      gP!==null?'Gradiente manana-tarde: PAS '+gP+' / PAD '+gD+' mmHg':'',
      'Efecto alerta medio: '+(st.avgAlert>0?'+':'')+st.avgAlert+' mmHg. Sesiones elevadas: '+elevCount+'/'+st.totalSessions+'.',
      st.avgHR?'FC media: '+st.avgHR+' lpm.':'',
      tSorted.length?'TRATAMIENTO: '+txDesc:'',
      'PA consulta: '+(ST.info.clinicSys?ST.info.clinicSys+'/'+ST.info.clinicDia+' mmHg':'no disponible')+'.',
      'SESIONES DETALLE:', ...sessLines,
      'REGLAS: 1) NUNCA hipertension como diagnostico. 2) Usar: PA dentro de objetivos AMPA / valores por encima de objetivos AMPA. 3) No prescribir. 4) Citar fechas y datos numericos. 5) Tipos: alert,warn,info,ok,note. 6) 2-4 frases por observacion.',
      'SOLO JSON: {"observations":[{"tipo":"alert","titulo":"Titulo","texto":"Analisis..."}]}'
    ].filter(l=>l).join('\n');
    const d=await callAPI([{role:'user',content:prompt}],2000);
    const txt=(d.content||[]).map(c=>c.text||'').join('');
    const parsed=JSON.parse(txt.replace(/```json|```/g,'').trim());
    return parsed.observations||[];
  }catch(e){return [];}
}

async function genObs() {
  ST.loadObs=true;render();
  ST.obs=await fetchObs();
  ST.loadObs=false;render();
}

async function openReport() {
  let reportObs=ST.obs;
  if(reportObs.length===0 && ST.meas.filter(m=>smean(m)).length>0){
    ST.loadObs=true;render();
    reportObs=await fetchObs();
    ST.obs=reportObs;ST.loadObs=false;
  }
  const st=calcStats(ST.meas);
  const status=getStatus(st,ST.info.clinicSys,ST.info.clinicDia);
  const html=buildReport(ST.meas,ST.info,st,status,reportObs,ST.treatments);
  const blob=new Blob([html],{type:'text/html;charset=utf-8'});
  const url=URL.createObjectURL(blob);
  const a=document.createElement('a');a.href=url;a.target='_blank';a.rel='noopener';
  document.body.appendChild(a);a.click();document.body.removeChild(a);
  setTimeout(()=>URL.revokeObjectURL(url),60000);
  render();
}

// ─── Arranque ────────────────────────────────────────────────────────
render();

</script>
